<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#06b6d4"/>
  <!-- Compass rose icon -->
  <g fill="#ffffff" transform="translate(32,32)">
    <!-- N arrow (top, white) -->
    <polygon points="0,-16 4,-4 0,-8 -4,-4" fill="#ffffff"/>
    <!-- S arrow (bottom, light) -->
    <polygon points="0,16 4,4 0,8 -4,4" fill="rgba(255,255,255,0.55)"/>
    <!-- E arrow -->
    <polygon points="16,0 4,4 8,0 4,-4" fill="rgba(255,255,255,0.55)"/>
    <!-- W arrow -->
    <polygon points="-16,0 -4,4 -8,0 -4,-4" fill="rgba(255,255,255,0.55)"/>
    <!-- Center ring -->
    <circle cx="0" cy="0" r="4" fill="#0f172a"/>
    <circle cx="0" cy="0" r="2" fill="#06b6d4"/>
  </g>
</svg>
